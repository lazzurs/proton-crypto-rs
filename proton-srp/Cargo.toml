[package]
name = "proton-srp"
version = "0.8.4"
edition.workspace = true
license = "MIT"
license-file = "LICENSE"
authors.workspace = true

[dependencies]
bcrypt = "0.17.1"
md5 = { package = "md-5", version = "0.10.6" }
# Modified for crypto-bigint 0.7 (RUSTSEC-2026-0387); was 0.5.5 with rand 0.8.
crypto-bigint = { version = "0.7.6", default-features = false, features = ["rand_core", "zeroize"] }
hex = { workspace = true }
rand = "0.10"
subtle = "2.6"
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Optional
pgp = { version = "0.21.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies] # Force js BE for wasm targets
getrandom = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_legacy = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
default = ["pgpinternal"]
pgpinternal = ["dep:pgp"]
custom_csprng = []

[profile.test]
opt-level = 3

[lints]
workspace = true
